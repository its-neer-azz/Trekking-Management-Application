<!DOCTYPE html>
<html>
<head>

<title>Edit Trek</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="container mt-5">


<h1 class="text-center mb-2">
    Trekking Management Application
</h1>

<p class="text-center text-primary mb-4">
    Update trek details and assign staff.
</p>


<div class="card shadow p-4 mx-auto" style="max-width:600px;">


    <h3 class="text-center mb-4">
        Edit Trek
    </h3>


    <form method="POST">


    <div class="mb-3">

    <label class="form-label">
        Trek Name
    </label>

    <input type="text" 
    name="name" 
    class="form-control"
    value="{{ trek.name }}"
    required>

    </div>



    <div class="mb-3">

            <label class="form-label">
                Location
            </label>

            <input type="text"
            name="location"
            class="form-control"
            value="{{ trek.location }}"
            required>

    </div>



    <div class="mb-3">

    <label class="form-label">
        Difficulty
    </label>

    <select name="difficulty" class="form-select">


    <option value="Easy"
    {% if trek.difficulty=="Easy" %}selected{% endif %}>
    Easy</option>


    <option value="Medium"
    {% if trek.difficulty=="Medium" %}selected{% endif %}>Medium</option>


    <option value="Hard"
    {% if trek.difficulty=="Hard" %}selected{% endif %}> Hard</option>


    </select>

    </div>



    <div class="mb-3">

        <label class="form-label">Duration (Days)
        </label>

        <input type="number"
        name="duration"
        class="form-control"
        value="{{ trek.duration }}">

    </div>



    <div class="mb-3">

        <label class="form-label">
            Total Slots</label>

        <input type="number"
        name="total_slots"
        class="form-control"
        value="{{ trek.total_slots }}">

    </div>

    <div class="mb-3">

        <label class="form-label">Available Slots
        </label>

        <input type="number"
        name="available_slots"
        class="form-control"
        value="{{ trek.available_slots }}">

    </div>

    <div class="mb-3">

        <label class="form-label">Status</label>


        <select name="status" class="form-select">

        <option value="Open"
        {% if trek.status=="Open" %}selected{% endif %}>Open
        </option>


        <option value="Closed"
        {% if trek.status=="Closed" %}selected{% endif %}>
        Closed
        </option>


        </select>

    </div>



    <!-- Assign Staff -->

    <div class="mb-4">

        <label class="form-label">Assign Staff
        </label>


        <select name="staff_id" class="form-select">


            <option value="">
            Select Staff</option>


            {% for staff in staff_members %}


            <option value="{{ staff.id }}"
            {% if trek.staff_id == staff.id %}
            selected
            {% endif %}>

            {{ staff.name }}

            </option>


            {% endfor %}

        </select>


    </div>




    <button type="submit" class="btn btn-primary w-100">

        Update Trek
    </button>



    </form>



    <hr>


    <div class="text-center">

        <a href="/admin" class="btn btn-secondary">
        Back to Dashboard
        </a>
        <a href="/logout" class="btn btn-danger">
        Logout</a>

    </div>


</div>

<br>

<hr>

<footer class="text-center text-muted small">

    <p class="mb-1">
    © 2026 Trekking Management Application</p>

</footer>

</body>
</html>
